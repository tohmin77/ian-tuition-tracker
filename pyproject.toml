[project]
name = "ian-tuition-tracker"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.35",
    "gspread>=6.0",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
